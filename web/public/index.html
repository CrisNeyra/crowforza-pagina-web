<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario - Herramientas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>📋 Formulario de Contacto</h1>
        
        <form id="contactForm">
            <div class="form-group">
                <label for="nombre">Nombre *</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre completo">
            </div>

            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required placeholder="tu@email.com">
            </div>

            <div class="form-group">
                <label for="numero_whatsapp">Número WhatsApp *</label>
                <input type="tel" id="numero_whatsapp" name="numero_whatsapp" required placeholder="+54 9 11 1234 5678">
            </div>

            <div class="form-group">
                <label for="mensaje">Mensaje *</label>
                <textarea id="mensaje" name="mensaje" required rows="5" placeholder="Tu mensaje aquí..."></textarea>
            </div>

            <button type="submit" class="btn-submit">Enviar Formulario</button>
        </form>

        <div id="message" class="message"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
