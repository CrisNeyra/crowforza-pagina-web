version: '3.8'

services:
  # ===== n8n =====
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_TUNNEL_URL=http://localhost:5678/
      - N8N_EDITOR_BASE_URL=http://localhost:5678/
    volumes:
      - n8n_storage:/home/node/.n8n
    networks:
      - herramientas-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5678/health"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  n8n_storage:
    driver: local

networks:
  herramientas-net:
    driver: bridge
